site_name: The Agentic Vault
site_description: A markdown vault template that gives AI sessions persistent project memory.
site_author: The Crusty Engineer
site_url: https://adamcee.github.io/agentic-vault/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Examples: examples.md
  - Installation:
    - Quickstart: installation/quickstart.md
    - Obsidian Setup (Recommended): installation/obsidian-setup.md
    - Setup Wizard: installation/wizard.md
    - Tooling Alternatives: installation/tooling-alternatives.md
  - The Methodology:
    - Design & Goals: methodology/design-and-goals.md
    - AGENTS.md Primacy: methodology/agents-md-primacy.md
    - The Session Protocol: methodology/session-protocol.md
    - Session Logs: methodology/session-logs.md
    - Decision Records (ADRs/PDRs): methodology/decision-records.md
    - The Reweave Protocol: methodology/reweave-protocol.md
    - Research Traceability: methodology/research-traceability.md
    - Evidence Maturity: methodology/evidence-maturity.md
    - Wikilink Discipline: methodology/wikilink-discipline.md
    - The Ideas Lifecycle: methodology/ideas-lifecycle.md
    - The Ingestion Gate: methodology/ingestion-gate.md
    - Vault Maintenance: methodology/vault-maintenance.md
    - AI Writing Discipline: methodology/writing-discipline.md
    - Sources & Further Reading: methodology/sources.md
